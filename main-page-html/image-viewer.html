<div class="image-viewer" id="imageViewer">
    <button class="viewer-close" id="viewerClose">×</button>
    <button class="viewer-arrow viewer-prev" id="viewerPrev">←</button>

    <div class="viewer-background viewer-background-current" id="viewerBackground"></div>
    <div class="viewer-background viewer-background-next" id="viewerBackgroundNext"></div>

    <div class="viewer-layout">
        <div class="viewer-image-container">
            <img src="" alt="" id="viewerImage">
        </div>

        <div class="viewer-info-panel">
            <div class="viewer-author">
                <span class="viewer-author-avatar" id="viewerAuthorAvatar">A</span>
                <div class="viewer-author-text">
                    <strong id="viewerAuthor">@aven_creator</strong>
                    <span id="viewerAuthorRole">Creator</span>
                </div>
            </div>

            <div class="viewer-profile-stats">
                <div>
                    <strong id="viewerPublications">—</strong>
                    <span>publications</span>
                </div>
                <div>
                    <strong id="viewerSubscribers">—</strong>
                    <span>subscribers</span>
                </div>
            </div>

            <div class="viewer-profile-actions">
                <button class="viewer-follow-button" id="viewerFollow">
                    Follow
                </button>

                <button class="viewer-profile-button" id="viewerProfile">
                    View profile →
                </button>
            </div>

            <div class="viewer-content-info">
                <span class="viewer-category" id="viewerCategory">
                    Architecture
                </span>

                <h2 id="viewerTitle">Architecture inspiration</h2>

                <p id="viewerDescription">
                    A collection of architectural inspiration and modern spaces.
                </p>

                <div class="viewer-tags" id="viewerTags"></div>

                <div class="viewer-actions">
                    <button class="viewer-action like-button" id="viewerLike">♡</button>
                    <div class="viewer-actions">
                        <button class="viewer-action like-button" id="viewerLike">♡</button>
                        <button class="viewer-action" id="viewerSave">Save</button>
                        <button class="viewer-action" id="viewerShare">↗</button>
                        <button class="viewer-action" id="viewerDownload">↓</button>
                    </div>
                    <button class="viewer-action" id="viewerShare">↗</button>
                    <button class="viewer-action" id="viewerDownload">↓</button>
                </div>

                <div class="viewer-comments">
                    <h3>Comments</h3>

                    <div class="comments-list" id="commentsList"></div>

                    <div class="comment-input">
                        <input
                            type="text"
                            id="commentInput"
                            placeholder="Add a comment..."
                        >
                        <button id="commentPost">Post</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="viewer-arrow viewer-next" id="viewerNext">→</button>
</div>
