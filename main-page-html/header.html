<header class="header">

    <div class="logo">
        <span class="logo-symbol">✦</span>
        <span class="logo-text">AVEN</span>
    </div>

    <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
            type="text"
            placeholder="Search ideas, images, creators, topics..."
        >
    </div>

    <div class="header-actions">

        <button class="header-button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                <path d="M10 21h4"></path>
            </svg>
        </button>

        <button class="header-button" aria-label="Messages">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 3v-3.5a2 2 0 0 1-2-2v-7.5a2 2 0 0 1 2-2z"></path>
            </svg>
        </button>

        <a
            href="registration-page-html/registration.html"
            class="profile-button"
            id="currentUserAvatar"
            aria-label="Sign In"
            title="Sign In"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5 20c.8-3.5 3.3-5.5 7-5.5s6.2 2 7 5.5"></path>
            </svg>
        </a>

    </div>

</header>
