<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AVEN</title>

    <link rel="stylesheet" href="main-page-css/style.css">
    <link rel="stylesheet" href="main-page-css/sidebar.css">
    <link rel="stylesheet" href="main-page-css/mobile.css">
    <link rel="stylesheet" href="create-publication/create-publication.css">
    <link rel="stylesheet" href="main-page-css/comments.css">
    <link rel="stylesheet" href="main-page-css/collection-picker.css">

    <script>
        try {
            const savedSettings = JSON.parse(
    localStorage.getItem("aven_settings") || "{}"
        );

        if (savedSettings.accent) {
    document.documentElement.style.setProperty(
                "--accent",
                savedSettings.accent
            );
        }

            const selectedTheme = savedSettings.theme || "dark";

            const resolvedTheme = selectedTheme === "auto"
                ? (window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light")
                : selectedTheme;

    document.documentElement.setAttribute(
                "data-theme",
                resolvedTheme
            );

        } catch (error) {
            console.warn("Could not load AVEN appearance settings", error);
        }
    </script>

    <link rel="stylesheet" href="splash-screen/splash.css">

</head>

<body>

    <div id="aven-splash" aria-hidden="true">

        <div class="splash-content">

            <div class="splash-glow"></div>

            <div class="splash-orbit"></div>

            <img
                src="splash-screen/logo.svg"
                alt="AVEN"
                class="splash-logo"
            >

        </div>

    </div>

    <script>
        if (sessionStorage.getItem("avenSplashShown") === "true") {
            document.getElementById("aven-splash").remove();
        }
    </script>

    <div id="header-container"></div>

    <div class="page-layout">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="hero-container"></div>
            <div id="categories-container"></div>
            <div id="image-grid-container"></div>
        </main>
    </div>

    <div id="image-viewer-container"></div>

    <script src="main-page-js/api.js"></script>
    <script src="main-page-js/image-grid.js"></script>
    <script src="main-page-js/categories.js"></script>
    <script src="main-page-js/current-user.js"></script>
    <script src="main-page-js/component-loader.js"></script>
    <script src="create-publication/create-publication.js"></script>
    <script src="main-page-js/comments.js"></script>
    <script src="splash-screen/splash.js"></script>
    <script src="main-page-js/collection-picker.js"></script>

</body>
</html>
