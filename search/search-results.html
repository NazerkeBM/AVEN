<section class="search-results" id="searchResults" hidden>

    <div class="search-results-heading">

        <h2 id="searchResultsTitle">
            Search results
        </h2>

        <span id="searchResultsCount"></span>

    </div>

    <div class="search-tabs">

        <button
            type="button"
            class="search-tab active"
            data-search-tab="all"
        >All</button>

        <button
            type="button"
            class="search-tab"
            data-search-tab="images"
        >Publications</button>

        <button
            type="button"
            class="search-tab"
            data-search-tab="users"
        >People</button>

    </div>

    <div class="search-users-section"
         id="searchUsersSection" hidden>

        <h3>People</h3>

        <div class="search-users-grid"
             id="searchUsersGrid"></div>

    </div>

    <p class="search-message"
       id="searchMessage" hidden></p>

</section>
