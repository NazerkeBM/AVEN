<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AVEN — Sign in</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../registration-page-css/registration.css">
</head>
<body>

  <main class="auth-card">

    <div class="space" aria-hidden="true">
      <div class="planet planet--top"></div>
      <div class="planet planet--bottom"></div>
      <div class="orbit orbit--bottom">
        <svg class="sparkle sparkle--big" viewBox="0 0 24 24"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0Z"/></svg>
      </div>
      <svg class="sparkle sparkle--small" viewBox="0 0 24 24"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0Z"/></svg>
      <span class="star star--1"></span>
      <span class="star star--2"></span>
      <span class="star star--3"></span>
      <span class="star star--4"></span>
    </div>

    <header class="auth-header">
      <a class="logo" href="../main/main.html" aria-label="AVEN — home">

        <svg class="logo__mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#c58cff"/>
            </linearGradient>
          </defs>
          <path d="M24 2c1 11 11 21 22 22-11 1-21 11-22 22-1-11-11-21-22-22C13 23 23 13 24 2Z" fill="url(#logoGrad)"/>
        </svg>
        <span class="logo__text">AVEN</span>
      </a>

      <nav class="top-nav" aria-label="Main">
        <a href="../main/main.html">Explore</a>
        <a href="../main/main.html#create">Create</a>
        <a href="../main/main.html#share">Share</a>
      </nav>
    </header>

    <!-- Форма входа -->
    <section class="auth-body">
      <h1 class="auth-title">Welcome <span>back</span></h1>
      <p class="auth-subtitle">Sign in to continue your journey</p>

      <form id="loginForm" class="auth-form" novalidate>

        <div class="field" data-field="login">
          <div class="field__box">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6.5L20.5 7"/>
            </svg>
            <input type="text" id="login" name="login" placeholder="Email or username" autocomplete="username" aria-label="Email or username">
          </div>
          <p class="field__error" role="alert"></p>
        </div>

        <div class="field" data-field="password">
          <div class="field__box">
            <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
            <button type="button" class="field__toggle" id="togglePassword" aria-label="Show password" aria-pressed="false">

              <svg class="icon-hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c5 0 8.5 4 9.5 6a13 13 0 0 1-2.6 3.3M6.6 7.6A13.4 13.4 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.4 0 2.7-.3 3.8-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>

              <svg class="icon-visible" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 12C3.5 10 7 6 12 6s8.5 4 9.5 6c-1 2-4.5 6-9.5 6s-8.5-4-9.5-6Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <p class="field__error" role="alert"></p>
        </div>

        <div class="form-row">
          <label class="check">
            <input type="checkbox" id="remember" name="remember">
            <span class="check__box" aria-hidden="true"></span>
            <span class="check__label">Remember me</span>
          </label>
          <a class="link link--pink" href="forgot-password.html">Forgot password?</a>
        </div>

        <p class="form-message" id="formMessage" role="alert"></p>

        <button type="submit" class="btn btn--primary" id="submitBtn">
          <span class="btn__text">Sign In</span>
          <svg class="btn__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span class="btn__spinner" aria-hidden="true"></span>
        </button>

        <div class="divider"><span>or</span></div>

        <button type="button" class="btn btn--outline" id="googleBtn">
          <svg class="btn__google" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5Z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5Z"/>
            <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1Z"/>
            <path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.500-5.800c-2.100 1.400-4.800 2.300-8.400 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48Z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

      </form>

      <p class="auth-footer">
        Don't have an account? <a class="link link--pink link--underline" href="signup.html">Sign Up</a>
      </p>
    </section>

  </main>

  <script type="module" src="../registration-page-js/main.js"></script>
</body>
</html>
