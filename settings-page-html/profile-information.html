<section class="block" id="block-profile" aria-labelledby="profileTitle">
              <h2 class="block__title" id="profileTitle">Profile Information</h2>
              <div class="avatar-row">
                <div class="avatar" id="avatarPreview">
                  <img id="avatarImg" alt="Your photo" hidden>
                  <svg id="avatarDefault" viewBox="0 0 48 48" aria-hidden="true">
                    <defs>
                      <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#ffffff"/>
                        <stop offset="1" stop-color="#c58cff"/>
                      </linearGradient>
                    </defs>
                    <path d="M24 5c1 9 10 18 19 19-9 1-18 10-19 19-1-9-10-18-19-19C14 23 23 14 24 5Z" fill="url(#avatarGrad)"/>
                  </svg>
                </div>
                <button type="button" class="btn-chip" id="changePhotoBtn">Change Photo</button>
                <input type="file" id="photoInput" accept="image/png,image/jpeg,image/webp" hidden>
                <p class="avatar-error" id="photoError" role="alert"></p>
              </div>
              <div class="field" data-field="name">
                <div class="field__box">
                  <label for="name" class="field__label">Name</label>
                  <input type="text" id="name" name="name" autocomplete="name" value="Danel Sailaubay">
                </div>
                <p class="field__error" role="alert"></p>
              </div>
              <div class="field" data-field="email">
                <div class="field__box">
                  <label for="email" class="field__label">Email</label>
                  <input type="email" id="email" name="email" autocomplete="email" value="danel@example.com">
                </div>
                <p class="field__error" role="alert"></p>
              </div>
              <div class="field" data-field="username">
                <div class="field__box">
                  <label for="username" class="field__label">Username</label>
                  <input type="text" id="username" name="username" autocomplete="username" value="danel_sailaubay">
                </div>
                <p class="field__error" role="alert"></p>
              </div>
            </section>
