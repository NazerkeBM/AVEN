<dialog class="follow-modal" id="followModal">

    <div class="follow-modal-header">

        <h2>Connections</h2>

        <button type="button"
                class="follow-modal-close"
                id="closeFollowModal"
                aria-label="Close">

            ×

        </button>

    </div>

    <div class="follow-modal-tabs">

        <button type="button"
                class="follow-modal-tab active"
                data-follow-tab="followers">

            Followers

        </button>

        <button type="button"
                class="follow-modal-tab"
                data-follow-tab="following">

            Following

        </button>

    </div>

    <div class="follow-modal-list"
         id="followModalList">
    </div>

</dialog>
