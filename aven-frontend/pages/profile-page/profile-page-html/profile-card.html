<section class="profile-card">

    <div class="profile-cover">

        <div class="cover-glow"></div>

        <div class="cover-stars">
            ✦　·　✧　　✦　·　✧
        </div>

        <div class="cover-title">
            Find beauty
        </div>

        <div class="cover-subtitle">
            in every detail
        </div>

    </div>

    <div class="profile-details">

        <div class="profile-avatar"></div>

        <div class="profile-information">

            <h1></h1>

            <p class="profile-username"></p>

            <p class="profile-role"></p>

            <p class="profile-bio"></p>

            <div class="profile-stats">

                <div>
                    <strong>—</strong>
                    <span>posts</span>
                </div>

                <div class="follow-stat"
                     id="openFollowers"
                     role="button"
                     tabindex="0">

                    <strong>—</strong>
                    <span>followers</span>

                </div>

                <div class="follow-stat"
                     id="openFollowing"
                     role="button"
                     tabindex="0">

                    <strong>—</strong>
                    <span>following</span>

                </div>

            </div>

        </div>

        <div class="profile-actions">

            <button type="button"
                    class="edit-profile-button"
                    id="editProfile">

                <span>✎</span> Edit Profile

            </button>

            <button type="button"
                    class="edit-profile-button"
                    id="profileFollow"
                    style="display: none;">

                Follow

            </button>

            <button type="button"
                    class="share-profile-button"
                    id="shareProfile">

                ↗ Share Profile

            </button>

            <button type="button"
                    class="more-profile-button"
                    aria-label="More options">

                ···

            </button>

        </div>

    </div>

</section>
