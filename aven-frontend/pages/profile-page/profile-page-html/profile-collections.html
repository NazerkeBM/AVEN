<section class="collections-section"
         id="collectionsSection"
         hidden>

    <div class="collections-heading">

        <h2 id="collectionsHeading">My collections</h2>

        <button type="button" id="newCollection">
            + New Collection
        </button>

    </div>

    <div class="collections-grid" id="collectionsGrid">

        <p class="profile-empty-state">
            Loading collections...
        </p>

    </div>

    <div class="collection-details"
         id="collectionDetails"
         hidden>

        <button type="button"
                class="collection-back"
                id="backToCollections">

            ← All collections

        </button>

        <div class="collection-details-header">

            <div class="collection-details-info">

                <h2 id="collectionDetailsName"></h2>

                <p id="collectionDetailsDescription"></p>

                <span id="collectionDetailsCount"></span>

            </div>

            <div class="collection-details-actions">

                <button type="button"
                        id="editCollection">

                    ✎ Edit

                </button>

                <button type="button"
                        id="deleteCollection">

                    Delete

                </button>

            </div>

        </div>

        <div class="collection-images-grid"
             id="collectionImagesGrid">
        </div>

    </div>

</section>
