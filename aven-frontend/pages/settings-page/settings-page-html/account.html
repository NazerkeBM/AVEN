<section
    class="panel is-active"
    id="panel-account"
    data-panel="account"
>

    <h1 class="page-title">Account</h1>

    <p class="page-subtitle">
        Manage your account and preferences
    </p>

    <template data-include="language.html"></template>

    <hr class="sep">

    <section class="block" aria-labelledby="sessionTitle">

        <h2 class="block__title" id="sessionTitle">
            Session
        </h2>

        <p class="block__hint">
            Sign out of your current AVEN account.
        </p>

        <button
            type="button"
            class="btn btn--signout"
            id="accountSignOut"
        >
            Sign out
        </button>

    </section>

</section>
