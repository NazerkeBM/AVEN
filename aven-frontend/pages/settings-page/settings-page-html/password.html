<section class="block" aria-labelledby="passwordTitle">

    <h2 class="block__title" id="passwordTitle">
        Change Password
    </h2>

    <p class="block__hint">
        Manage your account password.
    </p>

    <div class="field">

        <div class="field__box">

            <label class="field__label" for="currentPassword">
                Current password
            </label>

            <input
                type="password"
                id="currentPassword"
                placeholder="Enter current password"
                disabled
            >

        </div>

    </div>

    <div class="field">

        <div class="field__box">

            <label class="field__label" for="newPassword">
                New password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                disabled
            >

        </div>

    </div>

    <div class="field">

        <div class="field__box">

            <label class="field__label" for="confirmPassword">
                Confirm password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                disabled
            >

        </div>

    </div>

    <button
        type="button"
        class="btn btn--primary"
        id="changePasswordBtn"
        disabled
    >
        Change Password
    </button>

    <p class="block__hint">
        Password changing will be available soon.
    </p>

</section>
