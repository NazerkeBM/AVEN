<section class="block"
         id="block-appearance"
         aria-labelledby="appearanceTitle">

    <h2 class="block__title" id="appearanceTitle">
        Appearance
    </h2>

    <p class="block__hint">
        Choose how AVEN looks for you
    </p>

    <div class="themes"
         role="radiogroup"
         aria-label="Theme">

        <label class="theme">
            <input type="radio"
                   name="theme"
                   value="dark"
                   checked>

            <span class="theme__preview theme__preview--dark">
                <span class="theme__dot"></span>
            </span>

            <span class="theme__name">Dark</span>
        </label>

        <label class="theme">
            <input type="radio"
                   name="theme"
                   value="light">

            <span class="theme__preview theme__preview--light">
                <i></i><i></i><i></i>
            </span>

            <span class="theme__name">Light</span>
        </label>

        <label class="theme">
            <input type="radio"
                   name="theme"
                   value="auto">

            <span class="theme__preview theme__preview--auto"></span>

            <span class="theme__name">Auto</span>
        </label>

    </div>

    <p class="block__label" id="accentLabel">
        Accent color
    </p>

    <div class="accents"
         role="radiogroup"
         aria-labelledby="accentLabel">

        <label class="accent accent--pink">
            <input type="radio"
                   name="accent"
                   value="#f27fd0"
                   aria-label="Pink"
                   checked>
            <span></span>
        </label>

        <label class="accent accent--orchid">
            <input type="radio"
                   name="accent"
                   value="#c04fd8"
                   aria-label="Orchid">
            <span></span>
        </label>

        <label class="accent accent--violet">
            <input type="radio"
                   name="accent"
                   value="#8b6cf0"
                   aria-label="Violet">
            <span></span>
        </label>

        <label class="accent accent--blue">
            <input type="radio"
                   name="accent"
                   value="#4f8cff"
                   aria-label="Blue">
            <span></span>
        </label>

        <label class="accent accent--indigo">
            <input type="radio"
                   name="accent"
                   value="#5b5fe0"
                   aria-label="Indigo">
            <span></span>
        </label>

        <label class="accent accent--teal">
            <input type="radio"
                   name="accent"
                   value="#3fd0c9"
                   aria-label="Teal">
            <span></span>
        </label>

    </div>

</section>
