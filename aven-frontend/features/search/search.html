<form class="search-box" id="searchBox">

    <button
        type="submit"
        class="search-icon"
        id="searchSubmit"
        aria-label="Search"
    >⌕</button>

    <input
        type="text"
        id="searchInput"
        placeholder="Search ideas, images, creators, topics..."
        autocomplete="off"
    >

    <button
        type="button"
        id="clearSearch"
        aria-label="Clear search"
        hidden
    >×</button>

</form>
