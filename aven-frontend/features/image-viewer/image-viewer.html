<div class="image-viewer" id="imageViewer">

    <button class="viewer-close" id="viewerClose">×</button>

    <button class="viewer-arrow viewer-prev" id="viewerPrev">←</button>

    <div
        class="viewer-background viewer-background-current"
        id="viewerBackground">
    </div>

    <div
        class="viewer-background viewer-background-next"
        id="viewerBackgroundNext">
    </div>

    <div class="viewer-layout">

        <!-- Publication image -->

        <div class="viewer-image-container">
            <img src="" alt="" id="viewerImage">
        </div>

        <!-- Information panel -->

        <div class="viewer-info-panel">

            <!-- Author -->

            <div class="viewer-author">

                <span
                    class="viewer-author-avatar"
                    id="viewerAuthorAvatar">A</span>

                <div class="viewer-author-text">
                    <strong id="viewerAuthor">@aven_creator</strong>
                    <span id="viewerAuthorRole">Creator</span>
                </div>

            </div>

            <!-- Author statistics -->

            <div class="viewer-profile-stats">

                <div>
                    <strong id="viewerPublications">—</strong>
                    <span>publications</span>
                </div>

                <div>
                    <strong id="viewerSubscribers">—</strong>
                    <span>subscribers</span>
                </div>

            </div>

            <!-- Profile actions -->

            <div class="viewer-profile-actions">

                <button
                    class="viewer-follow-button"
                    id="viewerFollow">
                    Follow
                </button>

                <button
                    class="viewer-profile-button"
                    id="viewerProfile">
                    View profile →
                </button>

            </div>

            <!-- Publication information -->

            <div class="viewer-content-info">

                <span class="viewer-category" id="viewerCategory">
                    Architecture
                </span>

                <h2 id="viewerTitle">
                    Architecture inspiration
                </h2>

                <p id="viewerDescription">
                    A collection of architectural inspiration and modern spaces.
                </p>

                <div class="viewer-tags" id="viewerTags"></div>

                <!-- Publication actions -->

                <div class="viewer-actions">

    <!-- Collections -->
    <button
        type="button"
        class="viewer-collection-button"
        id="viewerCollection"
        title="Add to collection">

        <span class="collection-button-icon">▤</span>
        <span>Add to collection</span>
        <span class="collection-button-plus">+</span>

    </button>

    <!-- Secondary actions -->
    <div class="viewer-secondary-actions">

        <!-- Like -->
        <div class="viewer-action-item">

    <button
        class="viewer-action like-button"
        id="viewerLike"
        title="Like">♡</button>

    <span class="viewer-like-label">
        Like
        <span id="viewerLikeCount">0</span>
    </span>

</div>

        <!-- Save -->
        <div class="viewer-action-item">
            <button
                class="viewer-action"
                id="viewerSave"
                title="Save">♧</button>

            <span>Save</span>
        </div>

        <!-- Repost -->
        <div class="viewer-action-item">
            <button
                type="button"
                class="viewer-action viewer-repost-button"
                id="viewerRepost"
                title="Repost"
                aria-pressed="false"
                disabled>

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.6"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M17 2l4 4-4 4"/>
                    <path d="M3 11V9a3 3 0 0 1 3-3h15"/>
                    <path d="M7 22l-4-4 4-4"/>
                    <path d="M21 13v2a3 3 0 0 1-3 3H3"/>

                </svg>

                <span id="viewerRepostCount">0</span>

            </button>

            <span>Repost</span>
        </div>

        <!-- Share -->
        <div class="viewer-action-item">
            <button
                class="viewer-action"
                id="viewerShare"
                title="Share">↗</button>

            <span>Share</span>
        </div>

        <!-- Download -->
        <div class="viewer-action-item">
            <button
                class="viewer-action"
                id="viewerDownload"
                title="Download">↓</button>

            <span>Download</span>
        </div>

    </div>

</div>
                <!-- Comments -->

                <div class="viewer-comments">

                    <h3>Comments</h3>

                    <div
                        class="comments-list"
                        id="commentsList">
                    </div>

                    <div class="comment-input">

                        <input
                            type="text"
                            id="commentInput"
                            placeholder="Add a comment...">

                        <button id="commentPost">
                            Post
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <button class="viewer-arrow viewer-next" id="viewerNext">
        →
    </button>

</div>


<!-- Collection picker modal -->

<dialog class="collection-picker" id="collectionPicker">

    <div class="collection-picker-header">

        <h2>Add to collection</h2>

        <button
            type="button"
            class="collection-picker-close"
            id="closeCollectionPicker"
            aria-label="Close">
            ×
        </button>

    </div>

    <p class="collection-picker-description">
        Choose where to add this publication.
    </p>

    <div
        class="collection-picker-list"
        id="collectionPickerList">
    </div>

    <p id="collectionPickerError" role="alert" hidden></p>

    <button
        type="button"
        class="collection-picker-create"
        id="pickerNewCollection">
        + New Collection
    </button>

    <form id="pickerCreateForm" hidden>

    <div class="picker-create-field">

        <label for="pickerCollectionName">
            Collection name
        </label>

        <input
            type="text"
            id="pickerCollectionName"
            placeholder="Give your collection a name"
            maxlength="100"
            required>

    </div>

    <div class="picker-create-field">

        <label for="pickerCollectionDescription">
            Description
        </label>

        <textarea
            id="pickerCollectionDescription"
            placeholder="What inspires this collection?"
            rows="3"></textarea>

    </div>

    <div class="picker-create-actions">

        <button type="button" id="pickerCancelCreate">
            Cancel
        </button>

        <button type="submit" id="pickerConfirmCreate">
            Create & Add
        </button>

    </div>

</form>

    <button
        type="button"
        class="collection-picker-done"
        id="collectionPickerDone">
        Done
    </button>

</dialog>
