<dialog class="cp-dialog" id="createPublicationDialog">

    <div class="cp-header">
        <div>
            <h2>Create publication</h2>
            <p>Share your inspiration with the universe.</p>
        </div>

        <button type="button" class="cp-close"
                id="cpClose" aria-label="Close">
            ×
        </button>
    </div>

    <form id="createPublicationForm">

        <div class="cp-content">

            <div class="cp-upload" id="cpDropZone">

                <input type="file"
                       id="cpFile"
                       accept="image/png,image/jpeg"
                       hidden>

                <img id="cpPreview" alt="Image preview" hidden>

                <div class="cp-placeholder" id="cpPlaceholder">

                    <div class="cp-upload-icon">
                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="1.5">
                            <rect x="3" y="3" width="18"
                                  height="18" rx="4"/>
                            <circle cx="8" cy="8" r="1.5"/>
                            <path d="M3 17l6-6 4 4 3-3 5 5"/>
                        </svg>
                    </div>

                    <h3>Upload your image</h3>
                    <p>Drag and drop your inspiration here</p>

                </div>

                <button type="button"
                        class="cp-choose"
                        id="cpChoose">
                    Choose image
                </button>

                <span class="cp-file-hint">
                    PNG, JPG · Up to 10 MB
                </span>

            </div>

            <div class="cp-fields">

                <label for="cpTitle">Title</label>

                <input type="text"
                       id="cpTitle"
                       maxlength="150"
                       placeholder="Give your creation a name"
                       required>

                <span class="cp-counter"
                      id="cpTitleCounter">0 / 150</span>

                <label for="cpDescription">Description</label>

                <textarea id="cpDescription"
                          maxlength="2000"
                          placeholder="Tell us about your inspiration..."></textarea>

                <span class="cp-counter"
                      id="cpDescriptionCounter">0 / 2000</span>

                <label for="cpCategory">Category</label>

                <select id="cpCategory" required>
                    <option value="">Select category</option>
                </select>

            </div>

        </div>

        <p class="cp-message"
           id="cpMessage"
           role="status"></p>

        <div class="cp-footer">

            <button type="button"
                    class="cp-cancel"
                    id="cpCancel">
                Cancel
            </button>

            <button type="submit"
                    class="cp-publish"
                    id="cpPublish">
                ✦ Publish
            </button>

        </div>

    </form>

</dialog>
